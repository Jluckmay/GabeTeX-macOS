name: CI / Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / pull request supersedes the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build and checks (macOS 26)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # GabeTeX targets macOS 26 and builds with Swift 6.2 or newer, so use the newest *stable* Xcode on the
      # image (skipping betas and release candidates) and fall back to the newest of any kind.
      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true

          pick() {
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              if [ "${1:-}" = "stable" ]; then
                case "$app" in *[Bb]eta*|*_RC*|*[Rr]elease_[Cc]andidate*) continue ;; esac
              fi
              version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                "$app/Contents/Info.plist" 2>/dev/null || echo 0)
              echo "$version $app"
            done | sort -V | tail -n 1
          }

          best=$(pick stable)
          [ -n "$best" ] || best=$(pick any)
          [ -n "$best" ] || { echo "::error::No Xcode found in /Applications"; exit 1; }

          xcode_version=${best%% *}
          xcode_app=${best#* }
          echo "Selecting $xcode_app (Xcode $xcode_version)"
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          echo "XCODE_VERSION=$xcode_version" >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build products
        uses: actions/cache@v4
        with:
          path: .build
          # SwiftPM bakes absolute paths into .build, so the key carries the repository and the checkout path;
          # restore-keys stay within the same repository, path and Xcode version.
          key: ${{ runner.os }}-spm-${{ github.repository }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-xcode${{ env.XCODE_VERSION }}-${{ github.workspace }}-${{ hashFiles('Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ github.repository }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-xcode${{ env.XCODE_VERSION }}-${{ github.workspace }}-

      - name: Build
        run: swift build

      # The check executables replace XCTest, which is not available without a full Xcode.
      - name: TeXCoreChecks
        run: swift run TeXCoreChecks

      - name: VimKitChecks
        run: swift run VimKitChecks

      - name: EditorKitChecks
        run: swift run EditorKitChecks

      # Without --unit, TeXToolchainChecks also compiles real documents and expects MacTeX in
      # /Library/TeX/texbin, which the runner image does not have. --unit runs every suite that needs no TeX
      # installation: the log parser against the real-log fixtures, the shadow workspace, the process runner.
      # Run the full set (including the end-to-end compiles) locally with `swift run TeXToolchainChecks`.
      - name: TeXToolchainChecks (suites that need no TeX installation)
        run: swift run TeXToolchainChecks --unit

      - name: Build macOS release bundle and DMG
        run: bash Scripts/release.sh

      - name: Collect release assets
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          mkdir -p out
          cp dist/GabeTeX.dmg out/GabeTeX.dmg
          cp dist/GabeTeX.dmg "out/GabeTeX_${VERSION}_macos.dmg"
          cp build/GabeTeX.app/Contents/MacOS/GabeTeX out/gabetex-macos-standalone
          tar -czf "out/GabeTeX_${VERSION}_macos.app.tar.gz" -C build GabeTeX.app
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GabeTeX-macos
          path: out/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Get version
        run: |
          VERSION=$(grep -A1 '<key>CFBundleShortVersionString</key>' Support/Info.plist | tail -n1 | sed -E 's/.*<string>(.*)<\/string>.*/\1/' | tr -d '\r[:space:]')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: GabeTeX-macos
          path: out

      - name: Generate SHA-256 checksums
        run: |
          cd out
          sha256sum * > "GabeTeX-${VERSION}-macos-SHA256SUMS.txt"
          cat "GabeTeX-${VERSION}-macos-SHA256SUMS.txt"

      - name: Write release notes
        run: |
          TAG="${{ github.ref_name }}"
          cat > release-notes.md <<'EOF'
          # GabeTeX v%%VERSION%% (macOS)

          Automatic release generated by GitHub Actions from tag `%%TAG%%`.

          ## What's New & Fixes

          - **Math & Linguistic Symbols sidebar (`Σ` / `⌥⌘3`)**: 15 categories and 470 symbols across core LaTeX, `amsmath`, `amssymb`, `mathrsfs`, `gensymb`, `mathdots`, and `eurosym`, plus text-mode **Linguistic Symbols** with PDF-style curly serif quotation marks, search, live preview footer, `\log_{}` base-subscript snippet, click-to-insert, and drag-and-drop onto any position in `LaTeXTextView`.
          - **Context-aware delimiters & `\usepackage` auto-import**: automatically wraps symbols in `$...$` or `\[...\]` outside math mode (merging adjacent single `$` delimiters cleanly and skipping text-mode linguistic symbols) and inserts missing `\usepackage{...}` declarations into the preamble (including updating `main.tex` from preamble-less included files on click or drop).
          - **Smart auto-pairing & paired deletion**: extends auto-pairing with `\( \)` / `\[ \]` and automatic `\begin{env}...\end{env}` closing on `}`, plus paired forward/backward deletion protecting command arguments and `\left(...\right)` delimiters.
          - **More project templates**: added **Book**, **Report**, and **Poster** in `TeXCore.ProjectTemplates` (9 built-in templates localized in EN and `pt-BR`).
          - **Swift 6.2, security & polish fixes**: strict package-name validation, `isEditable` / capped / validated drag-and-drop payloads, safe detached `mainBuffer` updates, custom accent color tinting in `MathSymbolsSidebarView`, and PT-BR localization cleanup alongside all v1.1.1 Tectonic WASM, Zotero 7, VoiceOver, and compiler security improvements.

          ## Artifacts

          macOS installer bundles and binary (Swift / AppKit for macOS 26):

          - **Recommended complete bundles**: `GabeTeX.dmg`, `GabeTeX_%%VERSION%%_macos.dmg`, and `GabeTeX_%%VERSION%%_macos.app.tar.gz`
          - **Raw standalone binary**: `gabetex-macos-standalone` *(unbundled binary without `.app` resources such as `Info.plist`/ATS, `pt-BR.lproj`, or `tectonic-worker.js`)*

          ## SHA-256 Checksums

          See the attached file `GabeTeX-%%VERSION%%-macos-SHA256SUMS.txt`.

          ## Verification

          ```sh
          sha256sum -c GabeTeX-%%VERSION%%-macos-SHA256SUMS.txt
          ```

          ---

          # GabeTeX v%%VERSION%% (macOS — PT-BR)

          Release automática gerada pelo GitHub Actions a partir da tag `%%TAG%%`.

          ## Novidades e Correções

          - **Tabela de Símbolos Matemáticos e Linguísticos (`Σ` / `⌥⌘3`)**: 15 categorias e 470 símbolos (LaTeX padrão, `amsmath`, `amssymb`, `mathrsfs`, `gensymb`, `mathdots`, `eurosym` e **Símbolos Linguísticos** em modo texto com aspas curvas em serifa estilo PDF), busca em tempo real, rodapé de prévia com pacotes, `\log_{}` com subscrito de base, inserção por clique e arrastar e soltar direto no `LaTeXTextView`.
          - **Delimitadores automáticos e importação de `\usepackage`**: envolve símbolos automaticamente em `$...$` ou `\[...\]` fora do modo matemático (unindo `$` simples adjacentes sem criar `$$` e preservando modo texto para símbolos linguísticos) e importa pacotes faltantes no preâmbulo (atualizando `main.tex` ao editar fragmentos incluídos via clique ou drag-and-drop).
          - **Fechamento automático e remoção pareada**: fecha `\( \)`, `\[ \]` e `\begin{env}...\end{env}` ao digitar `}`, além de remoção pareada em `Backspace`/`Delete` protegendo argumentos de comandos e delimitadores `\left(...\right)`.
          - **Novos modelos de projeto**: adicionados **Livro**, **Relatório** e **Pôster** em `TeXCore.ProjectTemplates` (9 modelos embutidos em inglês e português do Brasil).
          - **Swift 6.2, segurança e refinamentos**: validação estrita de nomes de pacote em `MathContext`, verificação de `isEditable`/tamanho/pacote em drops no editor, atualização segura de seleção/desfazer em `mainBuffer`, cor de destaque personalizada em `MathSymbolsSidebarView` e tradução de `Import Package` no `pt-BR.lproj` junto a todas as melhorias de Tectonic WASM, Zotero 7, VoiceOver e compilador da v1.1.1.

          ## Artefatos

          Pacotes de instalação e binário para macOS (Swift / AppKit para macOS 26):

          - **Pacotes completos recomendados**: `GabeTeX.dmg`, `GabeTeX_%%VERSION%%_macos.dmg` e `GabeTeX_%%VERSION%%_macos.app.tar.gz`
          - **Binário avulso**: `gabetex-macos-standalone` *(executável fora do bundle `.app`, sem `Info.plist`/ATS, `pt-BR.lproj` nem `tectonic-worker.js`)*

          ## Checksums SHA-256

          Veja o arquivo `GabeTeX-%%VERSION%%-macos-SHA256SUMS.txt` anexado.

          ## Verificação

          ```sh
          sha256sum -c GabeTeX-%%VERSION%%-macos-SHA256SUMS.txt
          ```
          EOF
          sed -i "s/%%VERSION%%/$VERSION/g; s/%%TAG%%/$TAG/g" release-notes.md
          cat release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "GabeTeX v$VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "GabeTeX v$VERSION" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
          fi
          gh release upload "$TAG" out/* --clobber
