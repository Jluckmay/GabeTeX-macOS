name: CI / Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / pull request supersedes the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build and checks (macOS 26)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # GabeTeX targets macOS 26 and builds with Swift 6.2 or newer, so use the newest *stable* Xcode on the
      # image (skipping betas and release candidates) and fall back to the newest of any kind.
      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true

          pick() {
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              if [ "${1:-}" = "stable" ]; then
                case "$app" in *[Bb]eta*|*_RC*|*[Rr]elease_[Cc]andidate*) continue ;; esac
              fi
              version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                "$app/Contents/Info.plist" 2>/dev/null || echo 0)
              echo "$version $app"
            done | sort -V | tail -n 1
          }

          best=$(pick stable)
          [ -n "$best" ] || best=$(pick any)
          [ -n "$best" ] || { echo "::error::No Xcode found in /Applications"; exit 1; }

          xcode_version=${best%% *}
          xcode_app=${best#* }
          echo "Selecting $xcode_app (Xcode $xcode_version)"
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          echo "XCODE_VERSION=$xcode_version" >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build products
        uses: actions/cache@v4
        with:
          path: .build
          # SwiftPM bakes absolute paths into .build, so the key carries the repository and the checkout path;
          # restore-keys stay within the same repository, path and Xcode version.
          key: ${{ runner.os }}-spm-${{ github.repository }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-xcode${{ env.XCODE_VERSION }}-${{ github.workspace }}-${{ hashFiles('Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ github.repository }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-xcode${{ env.XCODE_VERSION }}-${{ github.workspace }}-

      - name: Build
        run: swift build

      # The check executables replace XCTest, which is not available without a full Xcode.
      - name: TeXCoreChecks
        run: swift run TeXCoreChecks

      - name: VimKitChecks
        run: swift run VimKitChecks

      - name: EditorKitChecks
        run: swift run EditorKitChecks

      # Without --unit, TeXToolchainChecks also compiles real documents and expects MacTeX in
      # /Library/TeX/texbin, which the runner image does not have. --unit runs every suite that needs no TeX
      # installation: the log parser against the real-log fixtures, the shadow workspace, the process runner.
      # Run the full set (including the end-to-end compiles) locally with `swift run TeXToolchainChecks`.
      - name: TeXToolchainChecks (suites that need no TeX installation)
        run: swift run TeXToolchainChecks --unit

      - name: Build macOS release bundle and DMG
        run: bash Scripts/release.sh

      - name: Collect release assets
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          mkdir -p out
          cp dist/GabeTeX.dmg out/GabeTeX.dmg
          cp dist/GabeTeX.dmg "out/GabeTeX_${VERSION}_macos.dmg"
          cp build/GabeTeX.app/Contents/MacOS/GabeTeX out/gabetex-macos-standalone
          tar -czf "out/GabeTeX_${VERSION}_macos.app.tar.gz" -C build GabeTeX.app
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GabeTeX-macos
          path: out/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Get version
        run: |
          VERSION=$(grep -A1 '<key>CFBundleShortVersionString</key>' Support/Info.plist | tail -n1 | sed -E 's/.*<string>(.*)<\/string>.*/\1/' | tr -d '\r[:space:]')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: GabeTeX-macos
          path: out

      - name: Generate SHA-256 checksums
        run: |
          cd out
          sha256sum * > "GabeTeX-${VERSION}-macos-SHA256SUMS.txt"
          cat "GabeTeX-${VERSION}-macos-SHA256SUMS.txt"

      - name: Write release notes
        run: |
          TAG="${{ github.ref_name }}"
          cat > release-notes.md <<'EOF'
          # GabeTeX v%%VERSION%% (macOS)

          Automatic release generated by GitHub Actions from tag `%%TAG%%`.

          ## What's New & Fixes

          - **Tectonic WASM compiler**: optional in-app fallback with serialized builds, SHA-256 integrity checks, isolated `WKWebView` navigation policy, crash recovery, binary asset support, line-number-preserving `\today` local date resolution, and PDF export on build.
          - **Zotero 7 integration**: local API browser and BibTeX exporter in Settings (`127.0.0.1:23119/api/users/0`, proxy bypass, local networking ATS enabled, All Items & collections support).
          - **Appearance & localization**: Light/Dark/System themes, custom accent color with 2x Retina dynamic app icon, Brazilian Portuguese (`pt-BR`) localization, configurable auto-save, and multi-language spell checking (`en` / `pt-BR`).
          - **VoiceOver accessibility**: live `NSAccessibility` announcements for builds, errors, status messages, and banners; cursor position & Vim mode readouts; accessible completion/Quick Open rows; and slide text exposure in Presentation mode.
          - **Compiler & security hardening**: `latexmk` timeouts (`120s` live / `300s` build), `$max_repeat = 5`, `-no-shell-escape` by default, leading-`-` filename option-injection guard, and blocked launching of untrusted executable/script files.

          ## Artifacts

          macOS installer bundles and binary (Swift / AppKit for macOS 26):

          - **Recommended complete bundles**: `GabeTeX.dmg`, `GabeTeX_%%VERSION%%_macos.dmg`, and `GabeTeX_%%VERSION%%_macos.app.tar.gz`
          - **Raw standalone binary**: `gabetex-macos-standalone` *(unbundled binary without `.app` resources such as `Info.plist`/ATS, `pt-BR.lproj`, or `tectonic-worker.js`)*

          ## SHA-256 Checksums

          See the attached file `GabeTeX-%%VERSION%%-macos-SHA256SUMS.txt`.

          ## Verification

          ```sh
          sha256sum -c GabeTeX-%%VERSION%%-macos-SHA256SUMS.txt
          ```

          ---

          # GabeTeX v%%VERSION%% (macOS — PT-BR)

          Release automática gerada pelo GitHub Actions a partir da tag `%%TAG%%`.

          ## Novidades e Correções

          - **Compilador Tectonic WASM**: opção de fallback embutida com compilações serializadas, verificação de integridade SHA-256, política de navegação isolada no `WKWebView`, recuperação de falhas, suporte a ativos binários, data local correta em `\today` preservando números de linha e exportação do PDF ao compilar.
          - **Integração com Zotero 7**: navegador da API local e exportador BibTeX nas Configurações (`127.0.0.1:23119/api/users/0`, bypass de proxy, ATS local habilitado, suporte a Todos os Itens e coleções).
          - **Aparência e idioma**: temas Claro/Escuro/Sistema, cor de destaque personalizada com ícone Retina 2x dinâmico, tradução para Português do Brasil (`pt-BR`), salvamento automático configurável e corretor ortográfico em `en` / `pt-BR`.
          - **Acessibilidade VoiceOver**: anúncios automáticos via `NSAccessibility` para compilações, erros, mensagens de status e banners; leitura de posição do cursor e modo Vim; linhas acessíveis no autocompletar e Quick Open; e exposição de texto dos slides no Modo Apresentação.
          - **Compilador e segurança**: timeouts do `latexmk` (`120s` ao vivo / `300s` build), `$max_repeat = 5`, `-no-shell-escape` por padrão, proteção contra injeção de opções em nomes de arquivo iniciados por `-` e bloqueio de execução de arquivos executáveis/scripts não confiáveis.

          ## Artefatos

          Pacotes de instalação e binário para macOS (Swift / AppKit para macOS 26):

          - **Pacotes completos recomendados**: `GabeTeX.dmg`, `GabeTeX_%%VERSION%%_macos.dmg` e `GabeTeX_%%VERSION%%_macos.app.tar.gz`
          - **Binário avulso**: `gabetex-macos-standalone` *(executável fora do bundle `.app`, sem `Info.plist`/ATS, `pt-BR.lproj` nem `tectonic-worker.js`)*

          ## Checksums SHA-256

          Veja o arquivo `GabeTeX-%%VERSION%%-macos-SHA256SUMS.txt` anexado.

          ## Verificação

          ```sh
          sha256sum -c GabeTeX-%%VERSION%%-macos-SHA256SUMS.txt
          ```
          EOF
          sed -i "s/%%VERSION%%/$VERSION/g; s/%%TAG%%/$TAG/g" release-notes.md
          cat release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "GabeTeX v$VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "GabeTeX v$VERSION" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
          fi
          gh release upload "$TAG" out/* --clobber
